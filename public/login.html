<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreelanceHub — Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header" style="padding-top: 1.5rem; padding-bottom: 2rem;">
    <nav class="app-nav">
      <a class="brand" href="index.html">FreelanceHub</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="jobs.html">Jobs</a>
        <a href="freelancers.html">Freelancers</a>
        <a href="proposals.html">Proposals</a>
        <a href="tasks.html">Tasks</a>
        <a href="payment.html">Payments</a>
      </div>
      <div class="nav-auth"></div>
    </nav>
  </header>

  <main class="page-shell">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Welcome back</h1>
        <p class="lead">Log in to your FreelanceHub account.</p>
      </div>

      <!-- Success banner shown after registration -->
      <p class="form-success" id="registered-banner" style="display:none;">
        ✅ Account created! Please log in.
      </p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="li-email">Email Address</label>
          <input type="email" id="li-email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="li-password">Password</label>
          <input type="password" id="li-password" placeholder="Your password" required />
        </div>

        <p class="form-error" id="login-error" style="display:none;"></p>

        <button type="submit" class="auth-submit-btn">Log In</button>

        <div style="margin-top:1.5rem; padding-top:1.25rem; border-top:1px solid var(--border, #e5e5ea); text-align:center;">
          <p style="font-size:0.85rem; color:var(--text-secondary); margin-bottom:0.75rem;">⚡ <strong>Quick Demo Login</strong></p>
          <div style="display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap;">
            <button type="button" id="demo-employer-btn" style="padding:0.45rem 0.85rem; font-size:0.82rem; border-radius:8px; border:1px solid #0071e3; background:#0071e310; color:#0071e3; font-weight:600; cursor:pointer;">
              👔 Log in as Employer
            </button>
            <button type="button" id="demo-freelancer-btn" style="padding:0.45rem 0.85rem; font-size:0.82rem; border-radius:8px; border:1px solid #34c759; background:#34c75910; color:#34c759; font-weight:600; cursor:pointer;">
              💻 Log in as Freelancer
            </button>
          </div>
        </div>
      </form>

      <p class="auth-switch">
        New to FreelanceHub? <a href="signup.html">Create an account</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="footer-year"></span> FreelanceHub. Built for modern freelance workflows.</p>
  </footer>

  <script type="module">
    import { login, renderAuthNav, getCurrentUser } from "./js/auth.js";

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("footer-year").textContent = new Date().getFullYear();
      renderAuthNav();

      // If already logged in, go home
      if (getCurrentUser()) window.location.href = "index.html";

      // Show success banner after registration redirect
      const params = new URLSearchParams(window.location.search);
      if (params.get("registered") === "1") {
        document.getElementById("registered-banner").style.display = "block";
      }

      document.getElementById("login-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const email    = document.getElementById("li-email").value.trim();
        const password = document.getElementById("li-password").value;
        const errEl    = document.getElementById("login-error");

        errEl.style.display = "none";

        const result = login({ email, password });
        if (!result.ok) {
          errEl.textContent = result.error;
          errEl.style.display = "block";
          return;
        }

        // Redirect to originally requested page or dashboard
        const next = params.get("next") || "dashboard.html";
        window.location.href = next;
      });

      // Quick Demo logins
      document.getElementById("demo-employer-btn")?.addEventListener("click", () => {
        document.getElementById("li-email").value = "employer@technova.com";
        document.getElementById("li-password").value = "password123";
        const result = login({ email: "employer@technova.com", password: "password123" });
        if (result.ok) {
          window.location.href = params.get("next") || "dashboard.html";
        }
      });

      document.getElementById("demo-freelancer-btn")?.addEventListener("click", () => {
        document.getElementById("li-email").value = "khush@freelancehub.com";
        document.getElementById("li-password").value = "password123";
        const result = login({ email: "khush@freelancehub.com", password: "password123" });
        if (result.ok) {
          window.location.href = params.get("next") || "dashboard.html";
        }
      });
    });
  </script>
</body>
</html>
